[build]
  # ビルドイメージをUbuntu 20.04 (Focal)に戻す（安定性のため）
  image = "ubuntu-20.04"
  # ビルドコマンドを指定
  command = "npm run build"

[build.environment]
  # Node.jsバージョンを18.20以降に設定（Gatsby要件 + got/undici互換性）
  NODE_VERSION = "18.20"
  # Gatsby設定
  GATSBY_CPU_COUNT = "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT = "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT = "120000"

# Gatsbyプラグインを有効化（最新版でundiciエラーが修正されている可能性）
[[plugins]]
  package = "@netlify/plugin-gatsby"

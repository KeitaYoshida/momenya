[build]
  # ビルドイメージをUbuntu 22.04 (Jammy)に指定
  image = "ubuntu-22.04"
  # ビルドコマンドを指定
  command = "npm run build"

[build.environment]
  # Node.jsバージョンを18に戻す（Gatsby要件）
  NODE_VERSION = "18"
  # undiciエラー回避のための環境変数
  NODE_OPTIONS = "--no-experimental-fetch"
  # 追加の環境変数
  GATSBY_CPU_COUNT = "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT = "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT = "120000"

# Gatsbyプラグインを一時的に無効化（undiciエラー回避のため）
# [[plugins]]
#   package = "@netlify/plugin-gatsby"
